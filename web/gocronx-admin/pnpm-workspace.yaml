# pnpm 10.34+/11 不再读取 package.json 的 "pnpm.overrides"，配置统一迁到这里。
# 这些是安全相关的最低版本约束（pin 掉有漏洞的传递依赖）。
overrides:
  nanoid: '>=3.3.17'
  yaml: '>=2.8.3'
  tar: '>=7.5.11'
  tmp: '>=0.2.6'
  postcss: '>=8.5.18'
  js-yaml: '>=5.2.2'
  form-data: '>=4.0.6'
  lodash: '>=4.17.23'
  lodash-es: '>=4.17.23'
  picomatch: '>=4.0.4'
  minimatch: '>=9.0.7'
  immutable: '>=5.1.5'
  flatted: '>=3.4.2'
  fast-uri: '>=4.1.2'
  brace-expansion: '>=5.0.9'
  defu: '>=6.1.5'
  # esbuild <0.28.1：两条 advisory（dev server 任意文件读取 / 二进制完整性校验缺失）
  esbuild: '>=0.28.1'
  # ajv ReDoS（仅 $data 选项触发，工具链未用）：只定向升 commitlint 的 ajv8，
  # 不动 eslint 自带的 ajv6（eslint 强依赖 ajv6 API，升 8 会直接跑不起来）。
  '@commitlint/config-validator>ajv': '>=8.18.0'
  # @babel/core 任意文件读取（vite-plugin-vue-devtools 间接依赖）
  '@babel/core': '>=7.29.6'

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gocron.fullname" . }}
  labels:
    {{- include "gocron.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "gocron.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "gocron.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gocron.serviceAccountName" . }}
      initContainers:
        - name: initialize-runtime
          image: "{{ .Values.image.repository }}:{{ include "gocron.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - mkdir -p /runtime/conf /runtime/log && cp /config/app.ini /runtime/conf/app.ini
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ include "gocron.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5920
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: GOCRON_MANAGED
              value: "true"
            - name: GOCRON_DB_ENGINE
              value: {{ .Values.db.engine | quote }}
            - name: GOCRON_DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: GOCRON_DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: GOCRON_DB_USER
              value: {{ .Values.db.user | quote }}
            - name: GOCRON_DB_DATABASE
              value: {{ .Values.db.database | quote }}
            - name: GOCRON_DB_PREFIX
              value: {{ .Values.db.prefix | quote }}
            - name: GOCRON_DB_CHARSET
              value: {{ .Values.db.charset | quote }}
            - name: GOCRON_DB_MAX_IDLE_CONNS
              value: {{ .Values.db.maxIdleConns | quote }}
            - name: GOCRON_DB_MAX_OPEN_CONNS
              value: {{ .Values.db.maxOpenConns | quote }}
            - name: GOCRON_ADMIN_USERNAME
              value: {{ .Values.managed.admin.username | quote }}
            - name: GOCRON_ADMIN_EMAIL
              value: {{ .Values.managed.admin.email | quote }}
            {{- $secretName := default (include "gocron.fullname" .) .Values.managed.existingSecret }}
            - name: GOCRON_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.managed.secretKeys.databasePassword }}
            - name: GOCRON_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.managed.secretKeys.authSecret }}
            - name: GOCRON_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.managed.secretKeys.encryptionKey }}
            - name: GOCRON_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.managed.secretKeys.adminPassword }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: runtime
              mountPath: /.gocron
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "gocron.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
                labelSelector:
                  matchLabels:
                    {{- include "gocron.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- end }}

replicaCount: 2

image:
  repository: ghcr.io/gocronx-team/gocron
  tag: "" # defaults to Chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Kubernetes deployments are managed and horizontally scalable. The database
# must already exist and be reachable through one stable MySQL/PostgreSQL URL.
db:
  engine: postgres
  host: ""
  port: 5432
  user: gocron
  password: ""
  database: gocron
  prefix: ""
  charset: utf8
  maxIdleConns: 5
  maxOpenConns: 100

managed:
  # Use an existing Secret instead of creating one. It must contain the keys
  # configured under secretKeys.
  existingSecret: ""
  secretKeys:
    databasePassword: db-password
    authSecret: auth-secret
    encryptionKey: encryption-key
    adminPassword: admin-password
  # Empty values are generated once and retained across Helm upgrades.
  authSecret: ""
  encryptionKey: ""
  admin:
    username: admin
    password: ""
    email: admin@example.com

app:
  name: gocron
  allowIps: ""
  concurrencyQueue: 500
  enableTls: false

timezone: Asia/Shanghai

service:
  type: ClusterIP
  port: 5920

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gocron.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# The memory limit lets gocron auto-tune Go's GOMEMLIMIT to about 90%.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# pnpm 10.34+/11 不再读取 package.json 的 "pnpm.overrides"，配置统一迁到这里。
# 根项目仅含提交工具链（husky/commitlint 等），这些是安全相关的最低版本约束。
overrides:
  # 1.x 已无安全补丁；统一升级并通过提交工具链检查验证兼容性。
  brace-expansion@<=5.0.8: '>=5.0.9'
  fast-uri: '>=4.1.2'
  flatted: '>=3.4.2'
  js-yaml: '>=5.2.2'
  lodash: '>=4.18.0'
  postcss: '>=8.5.23'
  tmp: '>=0.2.6'


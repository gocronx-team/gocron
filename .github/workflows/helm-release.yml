name: Release Helm Chart

on:
  push:
    branches:
      - master
    paths:
      - "helm/**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5

      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          # Don't fail if a chart version was already released (e.g. a helm/**
          # change landed without a Chart.yaml version bump); just skip it.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

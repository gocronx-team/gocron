# docs/ 独立 pnpm 工作区根：避免被仓库根的 pnpm-workspace.yaml 接管，
# 从而能独立安装 vitepress 依赖（与 web/gocronx-admin 相同的隔离方式）。
# 批准依赖的 install 构建脚本，否则 pnpm 10 会以"忽略构建脚本"报错阻断 build。
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  core-js: true

# 安全 override：把 vitepress 构建工具链里有漏洞的传递依赖锁到已修复版本。
# vite/esbuild 的修复仅在 vite 6.4.3+ / esbuild 0.25.0+ 提供（5.x 无 backport），
# 实测 vitepress 1.6.3 可正常基于 vite 6 构建静态文档，故强升以清除 Dependabot 告警。
overrides:
  nanoid: '>=3.3.17'
  rollup: '>=4.59.0'
  picomatch: '>=2.3.2'
  immutable: '>=5.1.5'
  postcss: '>=8.5.10'
  mdast-util-to-hast: '>=13.2.1'
  preact: '>=10.26.10'
  vite: '^6.4.3'
  esbuild: '^0.25.0'

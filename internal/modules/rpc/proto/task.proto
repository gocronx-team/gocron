syntax = "proto3";

package rpc;

option go_package = "github.com/gocronx-team/gocron/internal/modules/rpc/proto";

service Task {
    rpc Run(TaskRequest) returns (TaskResponse) {}
    // RunStream incrementally returns stdout/stderr. Schedulers fall back to
    // Run when an older node reports UNIMPLEMENTED.
    rpc RunStream(TaskRequest) returns (stream TaskResponse) {}
}

message TaskRequest {
    string command = 2; // 命令
    int32 timeout = 3;  // 任务执行超时时间
    int64 id = 4; // 执行任务唯一ID
    map<string, string> env = 5; // 注入到执行环境的环境变量(含机密),仅在执行期生效
}

message TaskResponse {
    string output = 1; // 命令标准输出
    string error = 2;  // 命令错误
}
